        // --- محرك عرض التطبيق ---

                case 'staff': return renderStaff();
                case 'reports': return renderReports();
                default: return renderDashboard();
            }
        }

                    <div class="flex justify-between items-center border-b pb-3">
                        <h3 class="font-bold text-lg text-slate-800">تبديل الصلاحية والدور الوظيفي</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <div class="space-y-2">
                        <button onclick="setUserRole('admin', 'د. خالد القحطاني', 'مدير المدرسة', 'د. خالد القحطاني')" class="w-full text-right p-3 rounded-xl hover:bg-sky-50 border border-slate-100 flex items-center justify-between transition">
                            <div>
                                <p class="font-bold text-slate-800 text-sm">مدير المدرسة</p>
                                <span class="text-xs text-slate-500">صلاحيات كاملة واعتمادات نهائية</span>
                            </div>
                            <i class="fa-solid fa-user-tie text-sky-600"></i>
                        </button>
                        <button onclick="setUserRole('vice', 'صالح آل حيدر', 'وكيل الشؤون التعليمية', 'صالح آل حيدر')" class="w-full text-right p-3 rounded-xl hover:bg-sky-50 border border-slate-100 flex items-center justify-between transition">
                            <div>
                                <p class="font-bold text-slate-800 text-sm">وكيل الشؤون التعليمية</p>
                                <span class="text-xs text-slate-500">إدارة اللجان، الجداول، والحضور</span>
                            </div>
                            <i class="fa-solid fa-user-shield text-sky-600"></i>
                        </button>
                        <button onclick="setUserRole('counselor', 'محمد الصيعري', 'الموجه الطلابي', 'محمد الصيعري')" class="w-full text-right p-3 rounded-xl hover:bg-sky-50 border border-slate-100 flex items-center justify-between transition">
                            <div>
                                <p class="font-bold text-slate-800 text-sm">الموجه الطلابي</p>
                                <span class="text-xs text-slate-500">الإرشاد السلوكي ومتابعة التعهدات</span>
                            </div>
                            <i class="fa-solid fa-handshake-angle text-sky-600"></i>
                        </button>
                        <button onclick="setUserRole('activity', 'بندر اليامي', 'رائد النشاط', 'بندر اليامي')" class="w-full text-right p-3 rounded-xl hover:bg-sky-50 border border-slate-100 flex items-center justify-between transition">
                            <div>
                                <p class="font-bold text-slate-800 text-sm">رائد النشاط</p>
                                <span class="text-xs text-slate-500">الخطط والبرامج اللاصفية والرحلات</span>
                            </div>
                            <i class="fa-solid fa-puzzle-piece text-sky-600"></i>
                        </button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
        }

        function setUserRole(role, name, title, sig) {
            currentUser = { id: 'USR-X', name, role, title, signature: sig };
            closeModal();
            render();
            showAlert(`تم التبديل بنجاح إلى صلاحية: ${title}`, 'success');
        }

        function closeModal() {
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        function triggerBackup() {
            showAlert('تم إنشاء النسخة الاحتياطية المشفرة لبيانات ثانوية مستقبل نجران بنجاح وحفظها بالسحابة', 'success');
        }

        function importExportCSV(type) {
            if (type === 'export') {
                showAlert('تم تصدير قاعدة بيانات الطلاب كملف CSV بنجاح', 'success');
            } else {
                showAlert('تم فتح معالج استيراد بيانات الطلاب من ملفات Excel/CSV', 'success');
            }
        }

        function deleteStudent(id) {
            students = students.filter(s => s.id !== id);
            render();
            showAlert('تم حذف سجل الطالب بنجاح وتحديث قاعدة البيانات', 'success');
        }

        function viewStudentCard(id) {
            const student = students.find(s => s.id === id);
            if (!student) return;
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            
            content.innerHTML = `
                <div class="p-6 space-y-4">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h3 class="font-bold text-lg text-slate-800">الملف التعريفي وبطاقة الطالب</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <div class="bg-sky-950 text-white p-6 rounded-2xl relative overflow-hidden shadow-inner">
                        <h4 class="font-extrabold text-xl">${student.name}</h4>
                        <p class="text-xs text-sky-300 mt-1">الرقم التعريفي: ${student.id} | الصف: ${student.grade} (${student.class})</p>
                        <div class="mt-4 pt-4 border-t border-white/10 flex justify-between text-xs">
                            <span>رقم ولي الأمر: ${student.phone}</span>
                            <span class="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded">${student.status}</span>
                        </div>
                    </div>
                    <button onclick="closeModal()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl font-semibold text-sm transition">
                        إغلاق
                    </button>
                </div>
            `;
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
        }

        function openAddStudentModal() {
            showAlert('نموذج إضافة طالب جديد وقبول بياناته جاهز للاستخدام', 'success');
        }

        function openAddSessionModal() {
            showAlert('نموذج تسجيل جلسة إرشادية جديدة وتعهد موثق جاهز للاستخدام', 'success');
        }

        function filterStudents() {
            const query = document.getElementById('search-student').value.toLowerCase();
            const rows = document.querySelectorAll('#students-table-body tr');
            let count = 0;
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                if (text.includes(query)) {
                    row.style.display = '';
                    count++;
                } else {
                    row.style.display = 'none';
                }
            });
            document.getElementById('student-count').innerText = count;
        }

        // بدء التشغيل
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
